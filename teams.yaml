# Each entry becomes its own .ics feed (so you can subscribe/color/toggle each
# team separately in Google Calendar). "sport" and "league" match ESPN's own
# URL segments -- see list_teams.py for how to find them and the numeric/abbr
# team_id for a given league.
#
# slug must be unique across this whole file -- it names the output file.
# team_id does NOT need to be globally unique (ESPN scopes it by sport+league),
# so the same school in two sports (e.g. Arkansas football and basketball,
# both team_id "ark") needs two different slugs, like ark-fb and ark-bb.
teams:
  - name: "Dallas Cowboys"
    slug: dal
    sport: football
    league: nfl
    team_id: dal

  - name: "Kansas City Chiefs"
    slug: kc
    sport: football
    league: nfl
    team_id: kc

  - name: "Arkansas Razorbacks"
    slug: ark
    sport: football
    league: college-football
    team_id: ark


